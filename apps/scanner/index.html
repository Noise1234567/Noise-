<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Noise — Scanner</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --surface: #1a1a1a;
        --accent: #00ff87;
        --secondary: #00c4ff;
        --text: #e8e8e8;
        --success: #00a85a;
        --error: #d93838;
        --warning: #e08a00;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
        overflow: hidden;
      }
      .screen {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      .screen--error .screen__title {
        color: var(--error);
      }
      .screen--success .screen__title {
        color: var(--accent);
      }
      .screen__title {
        margin: 0;
        font-size: 28px;
      }
      .screen__detail {
        margin: 0;
        font-size: 18px;
      }
      .button {
        min-height: 56px;
        padding: 0 32px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--bg);
        font-size: 18px;
        font-weight: 700;
      }
      .stage {
        position: relative;
        height: 100%;
      }
      .camera {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hint {
        position: absolute;
        bottom: 24px;
        left: 16px;
        right: 16px;
        margin: 0;
        padding: 12px;
        border-radius: 12px;
        background: rgb(0 0 0 / 60%);
        text-align: center;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        color: #fff;
      }
      .overlay--visible {
        display: flex;
      }
      .overlay--success {
        background: var(--success);
      }
      .overlay--error {
        background: var(--error);
      }
      .overlay--warning {
        background: var(--warning);
      }
      .overlay__title {
        margin: 0;
        font-size: 32px;
        font-weight: 800;
      }
      .overlay__detail {
        margin: 0;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
