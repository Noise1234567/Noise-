# Environnement local uniquement. Identifiants de développement, jamais utilisés ailleurs.
services:
  postgres:
    image: postgres:17-alpine
    container_name: noise-postgres
    environment:
      POSTGRES_USER: noise
      POSTGRES_PASSWORD: noise
      POSTGRES_DB: noise_dev
    ports:
      - '5432:5432'
    volumes:
      - noise-pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U noise -d noise_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  noise-pgdata:
