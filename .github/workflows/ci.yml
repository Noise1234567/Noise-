name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Titre de PR (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Base éphémère pour les tests d'intégration de l'API (NOISE-006).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: noise
          POSTGRES_PASSWORD: noise
          POSTGRES_DB: noise_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U noise -d noise_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://noise:noise@localhost:5432/noise_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @noise/shared build
      # Client Prisma et migrations sur la base de test (NOISE-006).
      - run: pnpm --filter @noise/api db:generate
      - run: pnpm --filter @noise/api db:deploy
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @noise/api build
      - run: pnpm --filter @noise/scanner build
